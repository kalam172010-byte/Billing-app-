name: Android CI - Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure .env.example exists for Secrets plugin
        run: |
          if [ ! -f .env.example ]; then
            printf 'FIREBASE_APPCHECK_DEBUG_TOKEN=\n' > .env.example
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -s debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "::warning::debug.keystore.base64 not found; generating a temporary CI debug keystore."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -s app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
                printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              else
                printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
              fi
            else
              echo "::warning::app/google-services.json not found and GOOGLE_SERVICES_JSON secret is unset; using a CI placeholder so APK compilation succeeds. Add GOOGLE_SERVICES_JSON to GitHub Secrets for live Firebase Auth & Firestore."
              cat <<'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder-project",
              "storage_bucket": "ci-placeholder-project.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.kalambillingpro.rkvtxm"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-ciplaceholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "ci-placeholder-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "000000000000-ciplaceholder.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi
          python3 -m json.tool app/google-services.json > /dev/null

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalam-billing-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --no-build-cache --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
